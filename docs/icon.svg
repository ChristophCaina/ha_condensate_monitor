<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f7fd6"/>
      <stop offset="1" stop-color="#174a8c"/>
    </linearGradient>
    <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a5434"/>
      <stop offset="1" stop-color="#523620"/>
    </linearGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d6ecff"/>
    </linearGradient>
    <clipPath id="r"><rect width="512" height="512" rx="104"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <!-- Erdreich -->
    <path d="M0 392 Q128 372 256 388 T512 384 V512 H0Z" fill="url(#soil)"/>
    <g fill="#3d2816" opacity=".55">
      <circle cx="70" cy="440" r="9"/><circle cx="150" cy="470" r="7"/>
      <circle cx="380" cy="452" r="10"/><circle cx="452" cy="480" r="6"/>
      <circle cx="300" cy="486" r="7"/>
    </g>
    <!-- Frostlinie im Boden -->
    <path d="M24 424 H488" stroke="#bfe3ff" stroke-width="7" stroke-dasharray="20 16" stroke-linecap="round" opacity=".85"/>
  </g>
  <!-- Tropfen -->
  <path d="M256 52 C256 52 112 214 112 300 A144 144 0 0 0 400 300 C400 214 256 52 256 52Z"
        fill="url(#drop)" stroke="#0f3566" stroke-opacity=".25" stroke-width="6"/>
  <!-- Schneeflocke -->
  <g transform="translate(256 296)" stroke="#1f63b5" stroke-width="17" stroke-linecap="round" fill="none">
    <g id="arm">
      <path d="M0 0 V-92"/>
      <path d="M0 -58 L-24 -82 M0 -58 L24 -82"/>
    </g>
    <use href="#arm" transform="rotate(60)"/>
    <use href="#arm" transform="rotate(120)"/>
    <use href="#arm" transform="rotate(180)"/>
    <use href="#arm" transform="rotate(240)"/>
    <use href="#arm" transform="rotate(300)"/>
  </g>
</svg>
